<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hospitationen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Pflichthospitationen</title>
<style>
  :root{
    --brick:#7B3B2E; --brick-soft:#F0E2DE; --plan:#C9A79C;
    --paper:#F4EFE6; --ink:#2A2422; --line:#E3DBCF;
    --muted:#79706A; --faint:#9A918A;
    --green:#3E7A6B; --green-soft:#DDE9E4;
    --amber:#9C7C2E; --amber-soft:#FBF2DF;
    --red:#9E3024; --red-soft:#F8E8E4;
    --field:#CFC3B2; --track:#DDD5C8;
    --gotisch:"Grenze Gotisch", Georgia, serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--paper); color:var(--ink)}
  body{
    font-family:"Grenze", Georgia, serif; font-size:16px; line-height:1.5;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }

  /* ---------- Kopf ---------- */
  header{
    padding:17px 16px 15px; background:linear-gradient(177deg,#7B3B2E,#6A3126);
    color:#F6EFE6; display:flex; align-items:center; gap:13px;
  }
  header .tor{flex:0 0 auto; width:50px; color:#E8C9BC}
  header .tor svg{display:block; width:100%}
  header h1{margin:0; font-family:var(--gotisch); font-size:26px; line-height:1.05; font-weight:400}
  header p{margin:4px 0 0; font-size:13.5px; color:#E0C6BB; letter-spacing:.02em}

  main{padding:16px 14px 0}
  h2{font-family:var(--gotisch); font-size:15px; font-weight:600; color:var(--muted);
     margin:0 0 9px; letter-spacing:.02em}
  .card{background:#fff; border:1px solid var(--line); border-radius:5px}
  .stack>*+*{margin-top:8px}
  .warn{display:flex; gap:9px; padding:12px; border-radius:5px; background:var(--red-soft);
        color:var(--red); font-size:14.5px; margin-bottom:12px; line-height:1.45}
  .backup{display:flex; gap:10px; align-items:center; padding:11px 13px; border-radius:5px;
          background:var(--amber-soft); color:#7A5A14; font-size:14px; margin-bottom:12px; line-height:1.4}

  /* ---------- Mauerwerk ---------- */
  .total{padding:15px 15px 13px; margin-bottom:12px}
  .flexb{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:12px}
  .total .num{font-size:38px; line-height:.92; font-weight:700; color:var(--brick)}
  .total .of{font-size:19px; color:var(--muted)}
  .reihen{display:flex; flex-direction:column; gap:3px}
  .reihe{display:grid; grid-template-columns:repeat(8,1fr); gap:3px}
  .ziegel{height:17px; border-radius:1.5px; background:var(--track)}
  .ziegel.voll{background:var(--brick); box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}
  .ziegel.voll.v1{background:#83422F} .ziegel.voll.v2{background:#733425}
  .ziegel.plan{background:var(--plan)}
  .legende{display:flex; gap:15px; flex-wrap:wrap; margin-top:11px; font-size:12.5px; color:var(--muted)}
  .legende span{display:flex; align-items:center; gap:6px}
  .swatch{width:11px; height:11px; border-radius:1.5px; display:inline-block}

  /* ---------- Kennzahlen ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .kpi{padding:9px 11px; border:1px solid var(--line); border-radius:5px; background:#fff}
  .kpi .lab{font-size:12.5px; color:var(--muted); line-height:1.3}
  .kpi .val{font-size:19px; font-weight:600; line-height:1.25; margin-top:2px}
  .kpi .sub{font-size:12.5px; color:var(--faint); margin-top:1px; line-height:1.3}
  .dot{display:inline-block; width:11px; height:11px; border-radius:99px}

  /* ---------- Planungslage ---------- */
  .prognose{padding:13px 15px; margin-bottom:12px; border-left:3px solid var(--green)}
  .prognose.gelb{border-left-color:var(--amber)}
  .prognose.rot{border-left-color:var(--red)}
  .prognose.grau{border-left-color:var(--field)}
  .prognose .titel{font-family:var(--gotisch); font-size:13px; color:var(--muted); margin-bottom:5px}
  .prognose .satz{font-size:15.5px; line-height:1.45}
  .prognose .satz b{color:var(--green); font-weight:600}
  .prognose.gelb .satz b{color:var(--amber)}
  .prognose.rot .satz b{color:var(--red)}
  .prognose.grau .satz b{color:var(--muted)}
  .prognose .detail{font-size:12.5px; color:var(--faint); margin-top:6px; line-height:1.45}

  /* ---------- Kategorien ---------- */
  .cat{width:100%; text-align:left; background:none; border:0; padding:12px 14px; font:inherit; color:inherit; display:block}
  .cat .head{display:flex; gap:9px; align-items:flex-start}
  .tag{flex:0 0 auto; width:25px; height:25px; border-radius:3px; font-size:14px; font-weight:700;
       display:flex; align-items:center; justify-content:center;
       background:var(--brick-soft); color:var(--brick); margin-top:1px; font-family:var(--gotisch)}
  .tag.ok{background:var(--green-soft); color:var(--green)}
  .cat .name{font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cat .cnt{font-size:14px; color:var(--muted); flex:0 0 auto; display:flex; align-items:center; gap:4px}
  .cat .cnt.ok{color:var(--green); font-weight:600}
  .bar{height:6px; border-radius:99px; background:var(--track); overflow:hidden; display:flex; margin-top:9px}
  .bar > i{display:block; height:100%; background:var(--brick); transition:width .25s ease}
  .bar > i.done{background:var(--green)}
  .bar > i.plan{background:var(--plan)}
  .meta{font-size:12.5px; color:var(--faint); margin-top:6px; line-height:1.4}
  .over{color:var(--brick)}
  .subs{padding:4px 14px 11px; border-top:1px solid #F0EAE0}
  .subrow{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14.5px}
  .subrow .r{font-size:12.5px; color:var(--muted)}
  .subrow .r.ok{color:var(--green)}

  /* ---------- Was fehlt ---------- */
  .fehlt{font-size:14.5px; padding:8px 0; display:flex; justify-content:space-between; gap:12px; line-height:1.4}
  .fehlt + .fehlt{border-top:1px solid #F0EAE0}
  .fehlt b{font-weight:600; color:var(--brick); flex:0 0 auto}

  /* ---------- Einträge ---------- */
  .item{display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff;
        border:1px solid var(--line); border-radius:5px}
  .item.past{background:var(--red-soft); border-color:#E0B4AA}
  .item .body{flex:1; min-width:0}
  .item .t{font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .item .s{font-size:12.5px; color:var(--muted); background:none; border:0; padding:0;
           font-family:inherit; text-align:left; line-height:1.4}
  .item.past .s{color:var(--red)}
  .item .s.todo{color:var(--brick)}
  .note{font-size:12.5px; color:var(--brick); margin-top:3px; line-height:1.35}
  .ic{flex:0 0 auto; border:0; border-radius:4px; padding:9px; background:#F1EAE0; color:var(--muted); line-height:0}
  .ic.ok{background:var(--green-soft); color:var(--green)}
  .ic svg{width:16px; height:16px; display:block}

  /* ---------- Knöpfe und Felder ---------- */
  .btn{border:1px solid var(--field); background:#fff; color:var(--ink); border-radius:5px;
       padding:12px; font-family:inherit; font-size:14.5px;
       display:flex; align-items:center; justify-content:center; gap:8px}
  .btn svg{width:15px; height:15px}
  .primary{background:var(--brick); color:#F6EFE6; border:0; border-radius:5px; padding:14px;
           font-family:var(--gotisch); font-size:18px; font-weight:600; width:100%;
           display:flex; align-items:center; justify-content:center; gap:8px; letter-spacing:.02em}
  .primary[disabled]{background:var(--track); color:var(--faint)}
  .fixed{position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
         background:var(--paper); border-top:1px solid var(--line)}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{border:1px solid var(--field); background:#fff; color:var(--ink); border-radius:5px;
        padding:9px 12px; font-family:inherit; font-size:14.5px}
  .chip.on{background:var(--brick); color:#F6EFE6; border-color:var(--brick)}
  .chip.sm{padding:7px 12px}
  .lab{font-size:12.5px; color:var(--muted); margin-bottom:6px}
  input[type=date],input[type=time],input[type=text]{
    width:100%; border:1px solid var(--field); background:#fff; color:var(--ink);
    border-radius:5px; padding:12px; font-family:inherit; font-size:16px}

  /* ---------- Overlays ---------- */
  .scrim{position:fixed; inset:0; background:rgba(42,36,34,.48); display:flex; align-items:flex-end; z-index:50}
  .sheet{width:100%; background:var(--paper); border-radius:14px 14px 0 0; padding:16px;
         padding-bottom:calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto}
  .sheet h3{margin:0; font-family:var(--gotisch); font-size:18px; font-weight:600}
  .sheet .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:13px}
  textarea{width:100%; height:260px; border:1px solid var(--field); border-radius:5px; padding:8px;
           font-family:ui-monospace,monospace; font-size:12px; background:#fff; color:var(--ink)}

  .mb4{margin-bottom:16px} .mb3{margin-bottom:12px} .mb2{margin-bottom:8px} .mb6{margin-bottom:24px}
  .hint{font-size:12.5px; color:var(--faint); line-height:1.45}
  .hidden{display:none}
  .leerzeichen{text-align:center; padding:18px 0 14px; color:#CFC3B5}
  .leerzeichen svg{width:66px}
  .leerzeichen p{margin:7px 0 0; font-size:13.5px; color:var(--faint)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--brick); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <span class="tor"><svg viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 40 C 7 28, 13 13, 19 4 C 25 13, 31 28, 36 40"/><path d="M64 40 C 69 28, 75 13, 81 4 C 87 13, 93 28, 98 40"/><path d="M19 4 V1"/><circle cx="19" cy="1.6" r="1.3" fill="currentColor" stroke="none"/><path d="M81 4 V1"/><circle cx="81" cy="1.6" r="1.3" fill="currentColor" stroke="none"/><path d="M2 40 Q 19 45 36 40"/><path d="M64 40 Q 81 45 98 40"/><path d="M4 43 V86"/><path d="M34 43 V86"/><path d="M66 43 V86"/><path d="M96 43 V86"/><path d="M36 48 L50 25 L64 48"/><path d="M36 48 H64"/><path d="M4 54 Q 19 56.8 34 54 L66 54 Q 81 56.8 96 54" stroke-width="1.5"/><path d="M4 62 Q 19 64.8 34 62 L66 62 Q 81 64.8 96 62" stroke-width="1.5"/><path d="M4 80 Q 19 82.8 34 80 L41 80" stroke-width="1.5"/><path d="M59 80 L66 80 Q 81 82.8 96 80" stroke-width="1.5"/><path d="M41 86 V77 A9 9 0 0 1 59 77 V86"/><path d="M0 86 H100"/></svg></span>
  <div>
    <h1>Pflichthospitationen</h1>
    <p>Stadtf&uuml;hrung L&uuml;beck &middot; Frist 17.01.2027</p>
  </div>
</header>
<main id="app"></main>
<div class="fixed"><button class="primary" data-act="new">+ Eintragen</button></div>
<div id="overlay"></div>
<input id="file" type="file" accept="application/json,.json" class="hidden">

<script>
"use strict";

/* ---------- Konfiguration ---------- */
var DEADLINE = new Date(2027, 0, 17);   /* 17.01.2027 */
var KEY = "hospitationen_stadtfuehrung_v1";

var CATS = [
  {id:"A", name:"Öffentliche Führungen", soll:6, mode:"frei", hinweis:"Bei verschiedenen Guides."},
  {id:"B", name:"Öffentliche Gängeführungen", soll:6, mode:"kontingent", subs:[
    {id:"handwerker", name:"Handwerkerviertel", soll:2},
    {id:"seefahrer", name:"Seefahrerviertel", soll:2},
    {id:"dom", name:"Domviertel", soll:2}
  ]},
  {id:"C", name:"Öffentliche Abendführungen", soll:3, mode:"verschieden", hinweis:"Nur unterschiedliche Themen zählen.", subs:[
    {id:"sexcrime", name:"Sex & Crime"},
    {id:"nachtwaechter", name:"Nachtwächter"},
    {id:"mystica", name:"Lubeca Mystica"},
    {id:"kostuem", name:"Kostümführung"},
    {id:"weihnachten", name:"Weihnachtsführung"}
  ]},
  {id:"D", name:"Touren mit Verköstigung", soll:1, mode:"verschieden", hinweis:"Nur unterschiedliche Themen zählen.", subs:[
    {id:"marzipan", name:"Marzipan"},
    {id:"kulinarisch", name:"Kulinarisch"},
    {id:"bier", name:"Bier"}
  ]},
  {id:"E", name:"Schülerführungen", soll:3, mode:"frei", hinweis:"Über den Gästeservice."},
  {id:"F", name:"Private Gruppen", soll:4, mode:"frei", hinweis:"Über den Gästeservice."},
  {id:"G", name:"Lübsche Verführung", soll:1, mode:"frei", hinweis:"Spezielle Themenführung."}
];
var CAT = {}; CATS.forEach(function(c){ CAT[c.id] = c; });

function subName(catId, subId){
  var c = CAT[catId]; if(!c || !c.subs) return subId;
  var s = c.subs.filter(function(x){ return x.id === subId; })[0];
  return s ? s.name : subId;
}

/* ---------- Startbestand: leer, alles wird selbst erfasst ---------- */
function SEED(){ return []; }

/* ---------- Datum ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function isoToDe(iso){ if(!iso) return null; var p = iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
function sod(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseISO(iso){ var p = iso.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function daysBetween(a,b){ return Math.round((sod(b)-sod(a))/86400000); }
function fmt1(n){ return n.toFixed(1).replace(".",","); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- Auswertung ---------- */
function auswerten(entries, mitGeplant){
  var done = entries.filter(function(e){
    return e.status === "absolviert" || (mitGeplant && e.status === "geplant");
  });
  var cats = CATS.map(function(cat){
    var mine = done.filter(function(e){ return e.cat === cat.id; });
    if(cat.mode === "frei"){
      var ang = Math.min(mine.length, cat.soll);
      return {cat:cat, gesamt:mine.length, angerechnet:ang, ueber:mine.length-ang, subs:[]};
    }
    if(cat.mode === "kontingent"){
      var subs = cat.subs.map(function(s){
        var n = mine.filter(function(e){ return e.sub === s.id; }).length;
        var a = Math.min(n, s.soll);
        return {sub:s, soll:s.soll, gesamt:n, angerechnet:a, ueber:n-a};
      });
      var sum = subs.reduce(function(a,s){ return a+s.angerechnet; },0);
      return {cat:cat, gesamt:mine.length, angerechnet:sum, ueber:mine.length-sum, subs:subs};
    }
    var themen = cat.subs.map(function(s){
      var list = mine.filter(function(e){ return e.sub === s.id; });
      var dates = list.map(function(e){ return e.date; }).filter(Boolean).sort();
      return {sub:s, gesamt:list.length, erst:dates[0] || "9999-99-99"};
    }).filter(function(t){ return t.gesamt > 0; })
      .sort(function(a,b){ return a.erst < b.erst ? -1 : (a.erst > b.erst ? 1 : 0); });
    var ids = {};
    themen.slice(0, cat.soll).forEach(function(t){ ids[t.sub.id] = true; });
    var subs2 = cat.subs.map(function(s){
      var t = themen.filter(function(x){ return x.sub.id === s.id; })[0];
      var n = t ? t.gesamt : 0;
      var a = ids[s.id] ? 1 : 0;
      return {sub:s, soll:1, gesamt:n, angerechnet:a, ueber:n-a};
    });
    var anz = Object.keys(ids).length;
    return {cat:cat, gesamt:mine.length, angerechnet:anz, ueber:mine.length-anz, subs:subs2};
  });

  var sollSumme = CATS.reduce(function(a,c){ return a+c.soll; },0);
  var ang = cats.reduce(function(a,c){ return a+c.angerechnet; },0);
  var rest = Math.max(sollSumme-ang, 0);

  var heute = new Date();
  var restTage = Math.max(daysBetween(heute, DEADLINE)+1, 0);
  var wochenVoll = Math.floor(restTage/7);
  var nenner = wochenVoll > 0 ? wochenVoll : restTage/7;
  var tempo = rest === 0 ? 0 : (nenner > 0 ? rest/nenner : Infinity);

  var datiert = done.map(function(e){ return e.date; }).filter(Boolean).sort();
  var schnitt = null;
  if(datiert.length >= 3){   /* unter drei Terminen ist ein Schnitt reine Zufallszahl */
    var span = Math.max(daysBetween(parseISO(datiert[0]), heute)+1, 1);
    schnitt = datiert.length/(span/7);
  }

  var ampel = "neutral";
  if(rest === 0) ampel = "gruen";
  else if(restTage <= 0 || !isFinite(tempo)) ampel = "rot";
  else if(schnitt === null) ampel = "neutral";
  else if(tempo <= schnitt) ampel = "gruen";
  else if(tempo <= schnitt*1.3) ampel = "gelb";
  else ampel = "rot";

  return {cats:cats, sollSumme:sollSumme, angerechnetGesamt:ang, rest:rest,
          prozent: sollSumme ? ang/sollSumme*100 : 0,
          restTage:restTage, restWochenVoll:wochenVoll, tempo:tempo, schnitt:schnitt, ampel:ampel,
          datierte:datiert.length,
          ohneDatum: done.filter(function(e){ return !e.date; }).length};
}

/* ---------- Abgeleitete Auswertungen ---------- */

/* Was fehlt konkret bis zum Soll */
function fehlliste(a){
  var out = [];
  a.cats.forEach(function(c){
    if(c.cat.mode === "kontingent"){
      c.subs.forEach(function(s){
        var n = s.soll - s.angerechnet;
        if(n > 0) out.push({was:c.cat.id+") "+s.sub.name, n:n});
      });
    } else if(c.cat.mode === "verschieden"){
      var n = c.cat.soll - c.angerechnet;
      if(n > 0){
        var offen = c.subs.filter(function(s){ return s.angerechnet === 0; })
                          .map(function(s){ return s.sub.name; });
        out.push({was:c.cat.id+") "+c.cat.name, n:n, zusatz:"noch offen: "+offen.join(", ")});
      }
    } else {
      var m = c.cat.soll - c.angerechnet;
      if(m > 0) out.push({was:c.cat.id+") "+c.cat.name, n:m});
    }
  });
  return out;
}

/* Fortschritt als Mauerwerk: ein Ziegel je Pflichtdurchführung */
function mauerwerk(voll, plan, gesamt){
  var h = '<div class="reihen">', i = 0;
  while(i < gesamt){
    h += '<div class="reihe">';
    for(var j = 0; j < 8 && i < gesamt; j++, i++){
      h += '<i class="ziegel' + (i < voll ? " voll v"+(i%3) : (i < voll+plan ? " plan" : "")) + '"></i>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* Reicht die Planung bis zur Frist? Rechnet ab dem spaetesten geplanten Termin. */
function planungslage(a){
  var mitPlan = S.entries.filter(function(e){
    return e.status === "absolviert" || (e.status === "geplant" && e.date);
  });
  var geplant = S.entries.filter(function(e){ return e.status === "geplant" && e.date; });
  var pot = auswerten(mitPlan, true);
  var offenNach = Math.max(a.sollSumme - pot.angerechnetGesamt, 0);
  var bewertbar = a.schnitt !== null;

  if(a.rest === 0)
    return {stufe:"", satz:"Alle " + a.sollSumme + " Pflichtdurchf\u00fchrungen sind <b>absolviert</b>.", detail:""};

  /* ohne geplante Termine: reine Tempobetrachtung */
  if(!geplant.length){
    if(!bewertbar)
      return {stufe:"grau", satz:"Noch <b>keine Aussage m\u00f6glich</b>.",
              detail:"Daf\u00fcr braucht es mindestens drei datierte Eintr\u00e4ge oder geplante Termine."};
    var reicht = a.tempo <= a.schnitt;
    var knapp  = !reicht && a.tempo <= a.schnitt * 1.3;
    return {
      stufe: reicht ? "" : (knapp ? "gelb" : "rot"),
      satz: "Keine geplanten Termine. Bei deinem bisherigen Schnitt " +
            (reicht ? "<b>reicht das Tempo</b>." : (knapp ? "wird es <b>knapp</b>." : "<b>reicht das Tempo nicht</b>.")),
      detail: "N\u00f6tig sind " + fmt1(a.tempo) + " pro Woche, bisher schaffst du " + fmt1(a.schnitt) + "."
    };
  }

  var letztes = geplant.map(function(e){ return e.date; }).sort().pop();
  var nutzlos = geplant.length - (pot.angerechnetGesamt - a.angerechnetGesamt);
  var meine = geplant.length === 1
    ? "Mit deinem geplanten Termin"
    : "Mit deinen " + geplant.length + " geplanten Terminen";

  if(parseISO(letztes) > DEADLINE)
    return {stufe:"rot", satz:"Ein geplanter Termin liegt <b>nach der Frist</b>.",
            detail:"Letzter geplanter Termin: " + isoToDe(letztes) + ". Was danach liegt, z\u00e4hlt nicht mehr."};

  var zusatz = nutzlos <= 0 ? ""
    : (nutzlos === 1
        ? " Einer der geplanten Termine bringt keine Anrechnung."
        : " " + nutzlos + " der geplanten Termine bringen keine Anrechnung.");

  if(offenNach === 0)
    return {stufe:"", satz: meine + " ist das Soll <b>vollst\u00e4ndig gedeckt</b>.",
            detail:"Letzter geplanter Termin: " + isoToDe(letztes) + "." + zusatz};

  /* ab dem spaetesten Termin, fruehestens ab heute */
  var ab = parseISO(letztes);
  if(ab < sod(new Date())) ab = sod(new Date());
  var tageNach = Math.max(daysBetween(ab, DEADLINE), 0);
  var wochenNach = tageNach / 7;
  var tempoNach = wochenNach > 0 ? offenNach / wochenNach : Infinity;

  var detail = "Letzter geplanter Termin: " + isoToDe(letztes) + ". Danach fehlen noch " + offenNach
             + " Durchf\u00fchrung" + (offenNach === 1 ? "" : "en")
             + (isFinite(tempoNach)
                 ? " in " + tageNach + " Tagen \u2014 " + fmt1(tempoNach) + " pro Woche."
                 : ", aber es bleibt keine Zeit mehr.")
             + zusatz;

  if(!isFinite(tempoNach))
    return {stufe:"rot", satz:"Nach dem letzten geplanten Termin bleibt <b>keine Zeit</b> f\u00fcr den Rest.", detail:detail};
  if(!bewertbar)
    return {stufe:"grau", satz: meine + " bleibt der Rest <b>noch nicht bewertbar</b>.",
            detail:detail + " Ein Schnitt l\u00e4sst sich erst ab drei datierten Eintr\u00e4gen berechnen."};

  var wort, stufe;
  if(tempoNach <= a.schnitt){ stufe = "";     wort = "bist du <b>im Zeitplan</b>"; }
  else if(tempoNach <= a.schnitt * 1.3){ stufe = "gelb"; wort = "wird es <b>knapp</b>"; }
  else { stufe = "rot"; wort = "bist du <b>nicht im Zeitplan</b>"; }

  return {stufe:stufe, satz: meine + " " + wort + ".", detail:detail};
}

/* Voraussichtliches Zieldatum beim bisherigen Schnitt */
function zieldatum(a){
  if(a.rest === 0) return {text:"Soll erfüllt", spaet:false};
  if(!a.schnitt || a.schnitt <= 0) return {text:"—", spaet:false};
  var tage = Math.ceil(a.rest / a.schnitt * 7);
  var d = new Date(); d.setDate(d.getDate() + tage);
  var iso = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return {text:isoToDe(iso), spaet: d > DEADLINE};
}

/* Bringt ein geplanter Termin überhaupt eine Anrechnung? */
function anrechnungKarte(){
  var voll = auswerten(S.entries, true).angerechnetGesamt;
  var karte = {};
  S.entries.filter(function(e){ return e.status === "geplant"; }).forEach(function(e){
    var ohne = S.entries.filter(function(x){ return x.id !== e.id; });
    karte[e.id] = auswerten(ohne, true).angerechnetGesamt < voll;
  });
  return karte;
}

/* Würde ein neuer Eintrag dieser Art noch zählen? */
function wuerdeZaehlen(cat, sub){
  if(!cat) return true;
  var probe = S.entries.concat([{id:"__probe", cat:cat, sub:sub||null, date:todayISO(),
                                 time:null, guide:null, en:false, status:"absolviert"}]);
  return auswerten(probe, true).angerechnetGesamt > auswerten(S.entries, true).angerechnetGesamt;
}

    S.seitSicherung = (data && typeof data.seitSicherung === "number") ? data.seitSicherung : 0;
  }catch(err){ S.entries = SEED(); S.seitSicherung = 0; }

  try{

function render(){

  var h = "";

  var enZahl = S.entries.filter(function(e){ return e.status === "absolviert" && e.en; }).length;
  if(enZahl > 0)

          + '</span></div>';

  h += '</div>';

  /* Was fehlt noch */

      + '<button class="ic" data-act="status" data-id="'+e.id+'" aria-label="Auf geplant zurücksetzen">'+I.undo+'</button>'
      + '<button class="ic" data-act="del" data-id="'+e.id+'" aria-label="Eintrag löschen">'+I.trash+'</button>'
      + '</div>';
  });
  h += '</div>';

  /* Daten */
  h += '<h2>Daten</h2><div class="grid2 mb3">'
    + '<button class="btn" data-act="json">'+I.down+' JSON sichern</button>'
    + '<button class="btn" data-act="md">'+I.down+' Markdown</button>'
    + '<button class="btn" data-act="import">'+I.up+' JSON laden</button>'
    + '<button class="btn" data-act="show">Text anzeigen</button></div>';

  if(S.entries.length){
    h += S.confirmDel
      ? '<button class="btn mb2" style="width:100%; background:var(--red); color:#fff; border:0" data-act="resetok">'
        + 'Wirklich alle '+S.entries.length+' Einträge löschen?</button>'
        + '<button class="btn mb3" style="width:100%" data-act="resetno">Abbrechen</button>'
      : '<button class="btn mb3" style="width:100%; color:var(--red); border-color:#E4B7AE" data-act="reset">'
        + 'Alle Einträge löschen</button>';
  }

  h += '<div class="card" style="padding:12px">'
    + '<div class="hint" style="color:'+(speicherOk?"var(--muted)":"var(--red)")+'">'
    + (speicherOk ? "Speicher aktiv. Die Daten liegen in diesem Browser auf diesem Gerät."
                  : "Speicher nicht verfügbar. Die Einträge gehen beim Schließen verloren — bitte per JSON sichern.")
    + '</div><div class="hint" style="margin-top:6px">Der Import ersetzt den gesamten Bestand durch den Inhalt der Datei.</div></div>'
    + '<div style="height:24px"></div>';

  document.getElementById("app").innerHTML = h;
  renderOverlay();
}

function zeile(e){

  if(e.time) t += " · " + e.time + " Uhr";
  if(e.guide) t += " · bei " + e.guide;
  if(e.en) t += " · Englisch";
  return t;
}

      html += '<button class="chip'+(s.cat===k.id?" on":"")+'" data-act="pickcat" data-cat="'+k.id+'">'+k.id+') '+esc(k.name)+'</button>';
    });
    html += '</div>';
    if(brauchtSub){
      html += '<div class="lab">Unterthema</div><div class="chips mb4">';
      c.subs.forEach(function(x){
        html += '<button class="chip'+(s.sub===x.id?" on":"")+'" data-act="picksub" data-sub="'+x.id+'">'+esc(x.name)+'</button>';
      });
      html += '</div>';
    }
    html += '<div class="grid2 mb3"><div><div class="lab">Datum</div>'
      + '<input type="date" id="f-date" value="'+(s.date||"")+'"></div>'
      + '<div><div class="lab">Uhrzeit</div><input type="time" id="f-time" value="'+(s.time||"")+'"></div></div>'
      + '<div class="lab">Guide</div><input type="text" id="f-guide" placeholder="Name des Guides" value="'+esc(s.guide||"")+'">'
      + chips(guideListe(), s.guide, "newguide")
      + '<div class="lab" style="margin-top:16px">Sprache</div><div class="grid2 mb4">'
      + '<button class="chip'+(!s.en?" on":"")+'" style="justify-content:center; padding:12px" data-act="picklang" data-en="0">Deutsch</button>'
      + '<button class="chip'+(s.en?" on":"")+'" style="justify-content:center; padding:12px" data-act="picklang" data-en="1">Englisch</button>'
      + '</div>'
      + '<div class="lab">Status</div><div class="grid2 mb4">'
      + '<button class="chip'+(s.status==="absolviert"?" on":"")+'" style="justify-content:center; padding:12px" data-act="pickstatus" data-status="absolviert">Absolviert</button>'
      + '<button class="chip'+(s.status==="geplant"?" on":"")+'" style="justify-content:center; padding:12px" data-act="pickstatus" data-status="geplant">Geplant</button>'
      + '</div>'
      + ((bereit && !wuerdeZaehlen(s.cat, s.sub))
          ? '<div class="note" style="margin-bottom:10px">Zählt nicht mehr aufs Soll. '
            + 'Dieser Eintrag wird als Überschuss geführt.</div>' : '')
      + '<button class="primary" data-act="save"'+(bereit?"":" disabled")+'>'
      + (bereit ? "Speichern" : (brauchtSub && !s.sub ? "Unterthema wählen" : "Kategorie wählen"))+'</button>'
      + '</div></div>';
    o.innerHTML = html;
    return;
  }
  o.innerHTML = "";
}

function chips(list, aktiv, act){
  if(!list.length) return "";
  var h = '<div class="chips" style="margin-top:8px">';
  list.forEach(function(g){
    h += '<button class="chip sm'+((aktiv||"").trim()===g?" on":"")+'" data-act="'+act+'" data-guide="'+esc(g)+'">'+esc(g)+'</button>';
  });
  return h+'</div>';
}

/* Werte aus offenen Feldern übernehmen, bevor neu gezeichnet wird */
function harvest(){
  var t = S.edit || S.sheet; if(!t) return;
  var d = document.getElementById("f-date"), z = document.getElementById("f-time"), g = document.getElementById("f-guide");
  if(d) t.date = d.value || null;
  if(z) t.time = z.value || null;
  if(g) t.guide = g.value;
}

/* ---------- Export / Import ---------- */
function jsonText(){ return JSON.stringify({version:1, exportiert:todayISO(), entries:S.entries}, null, 2); }
function mdText(){
  var a = auswerten(S.entries);
  var rows = S.entries.slice().sort(function(x,y){
    return ((x.date||"9999")+(x.time||"99:99")).localeCompare((y.date||"9999")+(y.time||"99:99"));
  });
  var out = "# Pflichthospitationen Stadtführung\n\nStand: "+isoToDe(todayISO())
    + " · Angerechnet: "+a.angerechnetGesamt+"/"+a.sollSumme+"\n\n"
    + "| Datum | Uhrzeit | Kategorie | Unterthema | Guide | Sprache | Status |\n|---|---|---|---|---|---|---|\n";
  rows.forEach(function(e){
    out += "| "+(isoToDe(e.date)||"offen")+" | "+(e.time||"–")+" | "+e.cat+") "+CAT[e.cat].name
        + " | "+(e.sub?subName(e.cat,e.sub):"–")+" | "+(e.guide||"–")
        + " | "+(e.en?"Englisch":"Deutsch")+" | "+e.status+" |\n";
  });
  return out;
}
function download(text, name, mime){
  try{
    var b = new Blob([text], {type:mime});
    var url = URL.createObjectURL(b);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(err){
    S.text = {titel:name, text:text}; renderOverlay();
  }
}

document.getElementById("file").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var data = JSON.parse(String(r.result));
      if(!data || !Array.isArray(data.entries)) throw new Error("Feld 'entries' fehlt.");
      S.entries = data.entries.filter(function(e){ return e && CAT[e.cat]; }).map(function(e,i){
        return {id:e.id || "imp-"+i, cat:e.cat, sub:e.sub||null, date:e.date||null,
                time:e.time||null, guide:e.guide||null, en: !!e.en,
                status: e.status === "geplant" ? "geplant" : "absolviert"};
      });
      S.seitSicherung = 0; schreiben(); render();
    }catch(err){
      S.text = {titel:"Import abgebrochen", text:"Die Datei ließ sich nicht lesen: "+err.message};
      renderOverlay();
    }
  };
  r.readAsText(f);
  ev.target.value = "";
});

/* ---------- Ereignisse ---------- */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]");
  if(!b) return;
  var act = b.getAttribute("data-act");
  var id = b.getAttribute("data-id");

  if(act === "close"){
    /* Nur schließen, wenn die abdunkelnde Fläche selbst getroffen wurde,
       nicht wenn der Klick aus dem Fenster nach oben durchgereicht wird. */
    if(b.classList.contains("scrim") && ev.target.closest(".sheet")) return;
    harvest(); S.sheet = null; S.edit = null; S.text = null; renderOverlay(); return;
  }
  if(act === "toggle"){ var k = b.getAttribute("data-cat"); S.open[k] = !S.open[k]; render(); return; }
  if(act === "new"){ S.sheet = {cat:null, sub:null, date:todayISO(), time:"", guide:"", en:false, status:"absolviert"}; renderOverlay(); return; }
  if(act === "pickcat"){ harvest(); S.sheet.cat = b.getAttribute("data-cat"); S.sheet.sub = null; renderOverlay(); return; }
  if(act === "picksub"){ harvest(); S.sheet.sub = b.getAttribute("data-sub"); renderOverlay(); return; }
  if(act === "picklang"){ harvest(); S.sheet.en = b.getAttribute("data-en") === "1"; renderOverlay(); return; }
  if(act === "editlang"){ harvest(); S.edit.en = b.getAttribute("data-en") === "1"; renderOverlay(); return; }
  if(act === "pickstatus"){ harvest(); S.sheet.status = b.getAttribute("data-status"); renderOverlay(); return; }
  if(act === "newguide"){ harvest(); var g = b.getAttribute("data-guide"); S.sheet.guide = (S.sheet.guide||"").trim() === g ? "" : g; renderOverlay(); return; }
  if(act === "editguide"){ harvest(); var g2 = b.getAttribute("data-guide"); S.edit.guide = (S.edit.guide||"").trim() === g2 ? "" : g2; renderOverlay(); return; }
  if(act === "save"){
    harvest(); var s = S.sheet;
    if(!s.cat || !s.date) return;
    if(CAT[s.cat].subs && !s.sub) return;
    S.entries.push({id:"e-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
      cat:s.cat, sub:s.sub||null, date:s.date, time:s.time||null,
      guide:(s.guide && s.guide.trim()) ? s.guide.trim() : null, en: !!s.en, status:s.status});
    S.sheet = null; sichern(); render(); return;
  }
  if(act === "edit"){
    var e = S.entries.filter(function(x){ return x.id === id; })[0];
    if(e){ S.edit = {id:e.id, cat:e.cat, sub:e.sub, date:e.date, time:e.time, guide:e.guide, en: !!e.en}; renderOverlay(); }
    return;
  }
  if(act === "saveedit"){
    harvest(); var t = S.edit;
    S.entries = S.entries.map(function(x){
      return x.id === t.id ? Object.assign({}, x, {date:t.date||null, time:t.time||null,
        guide:(t.guide && t.guide.trim()) ? t.guide.trim() : null, en: !!t.en}) : x;
    });
    S.edit = null; sichern(); render(); return;
  }
  if(act === "status"){
    S.entries = S.entries.map(function(x){
      return x.id === id ? Object.assign({}, x, {status: x.status === "absolviert" ? "geplant" : "absolviert"}) : x;
    });
    sichern(); render(); return;
  }
  if(act === "del"){ S.entries = S.entries.filter(function(x){ return x.id !== id; }); sichern(); render(); return; }
  if(act === "reset"){ S.confirmDel = true; render(); return; }
  if(act === "resetno"){ S.confirmDel = false; render(); return; }
  if(act === "resetok"){ S.entries = []; S.confirmDel = false; sichern(); render(); return; }
  if(act === "json"){
    download(jsonText(), "hospitationen-"+todayISO()+".json", "application/json");
    S.seitSicherung = 0; schreiben(); render(); return;
  }
  if(act === "md"){ download(mdText(), "hospitationen-"+todayISO()+".md", "text/markdown"); return; }
  if(act === "show"){ S.text = {titel:"Markdown-Tabelle", text:mdText()}; renderOverlay(); return; }
  if(act === "import"){ document.getElementById("file").click(); return; }
});

/* ---------- Start ---------- */
laden();
render();
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
